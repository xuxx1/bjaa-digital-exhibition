<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北京画院 · 内容管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .sidebar-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; color: #6b7280; font-size: 14px; transition: all .15s; }
  .sidebar-link:hover { background: #f3f4f6; color: #374151; }
  .sidebar-link.active { background: #fef2f2; color: #991b1b; font-weight: 600; }
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all .15s; }
  .btn-primary { background: #991b1b; color: white; } .btn-primary:hover { background: #7f1d1d; }
  .btn-outline { border: 1px solid #d1d5db; color: #374151; } .btn-outline:hover { background: #f9fafb; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; }
  .input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  .input:focus { border-color: #991b1b; box-shadow: 0 0 0 2px rgba(153,27,27,.1); }
  textarea.input { min-height: 80px; resize: vertical; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-confirmed { background: #d1fae5; color: #065f46; }
  .badge-cancelled { background: #f3f4f6; color: #6b7280; }
  .badge-done { background: #dbeafe; color: #1e40af; }
  .upload-wrap { display: flex; gap: 8px; align-items: stretch; }
  .upload-wrap input.input { flex: 1; }
  .upload-btn { padding: 0 14px; border-radius: 8px; font-size: 13px; cursor: pointer; background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; white-space: nowrap; transition: all .15s; display: flex; align-items: center; justify-content: center; min-height: 38px; }
  .upload-btn:hover { background: #e5e7eb; }
  .upload-btn.uploading { opacity: .5; cursor: wait; }
  .upload-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .del-btn { padding: 0 10px; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; white-space: nowrap; min-height: 38px; display: flex; align-items: center; justify-content: center; }
  .del-btn:hover { background: #fee2e2; }
  .upload-preview { margin-top: 8px; }
  .upload-preview img { max-height: 120px; border-radius: 8px; border: 1px solid #e5e7eb; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 登录页 -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="card p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-center mb-6">北京画院 · 内容管理</h1>
    <div class="mb-4">
      <label class="block text-sm text-gray-600 mb-1">用户名</label>
      <input id="loginUser" class="input" value="admin" placeholder="admin">
    </div>
    <div class="mb-6">
      <label class="block text-sm text-gray-600 mb-1">密码</label>
      <input id="loginPass" class="input" type="password" value="admin123" placeholder="admin123">
    </div>
    <button onclick="doLogin()" class="btn btn-primary w-full">登 录</button>
    <p id="loginError" class="text-red-600 text-sm mt-3 text-center hidden"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="mainApp" class="hidden flex min-h-screen">
  <!-- 侧边栏 -->
  <aside class="w-52 bg-white border-r border-gray-200 p-4 flex flex-col shrink-0">
    <div class="mb-6">
      <h2 class="font-bold text-lg text-gray-800">画院管理</h2>
      <p class="text-xs text-gray-400 mt-1">BFAA Admin</p>
    </div>
    <nav class="flex-1 space-y-1" id="sidebarNav">
      <a class="sidebar-link active" data-page="exhibitions" onclick="switchPage('exhibitions')">
        <span>🖼</span> 展览管理</a>
      <a class="sidebar-link" data-page="artworks" onclick="switchPage('artworks')">
        <span>🎨</span> 藏品管理</a>
      <a class="sidebar-link" data-page="programs" onclick="switchPage('programs')">
        <span>📋</span> 讲座/活动</a>
      <a class="sidebar-link" data-page="news" onclick="switchPage('news')">
        <span>📰</span> 新闻管理</a>
      <a class="sidebar-link" data-page="courses" onclick="switchPage('courses')">
        <span>🎓</span> 线上微课</a>
      <a class="sidebar-link" data-page="submissions" onclick="switchPage('submissions')">
        <span>📮</span> 征集管理</a>
      <a class="sidebar-link" data-page="feedback" onclick="switchPage('feedback')">
        <span>💬</span> 用户反馈</a>
      <a class="sidebar-link" data-page="sensitiveWords" onclick="switchPage('sensitiveWords')">
        <span>🛡</span> 敏感词管理</a>
      <a class="sidebar-link" data-page="announcements" onclick="switchPage('announcements')">
        <span>📢</span> 公告管理</a>
      <a class="sidebar-link" data-page="digitalGalleries" onclick="switchPage('digitalGalleries')">
        <span>🌐</span> 数字展厅</a>
      <a class="sidebar-link" data-page="bookings" onclick="switchPage('bookings')">
        <span>📅</span> 预约管理</a>
    </nav>
    <div class="pt-4 border-t">
      <button onclick="doLogout()" class="text-sm text-gray-400 hover:text-gray-600">退出登录</button>
    </div>
  </aside>

  <!-- 内容区 -->
  <main class="flex-1 p-6 overflow-auto">
    <div id="pageContent"></div>
  </main>
</div>

<script>
const API = ''
let TOKEN = localStorage.getItem('bfaa_token') || ''
let currentPage = 'exhibitions'

// ============ 通用 ============
function genId(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }

// ============ 图片上传 ============
async function uploadImage(file) {
  const formData = new FormData()
  formData.append('file', file)
  const res = await fetch(API + '/api/admin/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN },
    body: formData
  })
  if (!res.ok) throw new Error('上传失败')
  return await res.json()
}
function bindImageUpload(inputId) {
  const wrap = document.getElementById(inputId).parentElement
  const input = document.getElementById(inputId)
  // 包裹 input
  input.classList.add('input')
  input.style.flex = '1'
  input.parentElement.innerHTML = `<div class="upload-wrap"><input class="input" id="${inputId}" value="${input.value}" placeholder="输入图片URL或点击右侧按钮上传" style="flex:1"><button type="button" class="upload-btn" onclick="triggerUpload('${inputId}')">选择文件</button></div><div class="upload-hint">支持 JPG / PNG，建议宽度 ≥ 800px</div><div class="upload-preview" id="${inputId}_preview"></div>`
  document.getElementById(inputId).value = input.value
  showImagePreview(inputId)
}
function triggerUpload(inputId) {
  const input = document.getElementById(inputId)
  const fileInput = document.createElement('input')
  fileInput.type = 'file'
  fileInput.accept = 'image/*'
  fileInput.onchange = async () => {
    const file = fileInput.files[0]
    if (!file) return
    const btn = input.parentElement.querySelector('.upload-btn')
    btn.textContent = '上传中...'
    btn.classList.add('uploading')
    try {
      const result = await uploadImage(file)
      input.value = result.url
      showImagePreview(inputId)
      btn.textContent = '选择文件'
      btn.classList.remove('uploading')
    } catch (e) {
      alert('上传失败：' + e.message)
      btn.textContent = '选择文件'
      btn.classList.remove('uploading')
    }
  }
  fileInput.click()
}
function showImagePreview(inputId) {
  const url = document.getElementById(inputId).value
  const preview = document.getElementById(inputId + '_preview')
  if (!preview) return
  preview.innerHTML = url ? `<img src="${url}" onerror="this.parentElement.innerHTML=''">` : ''
}

// ============ 认证 ============
async function doLogin() {
  const username = document.getElementById('loginUser').value
  const password = document.getElementById('loginPass').value
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    const data = await res.json()
    if (data.token) {
      TOKEN = data.token
      localStorage.setItem('bfaa_token', TOKEN)
      showApp()
    } else {
      document.getElementById('loginError').textContent = data.error || '登录失败'
      document.getElementById('loginError').classList.remove('hidden')
    }
  } catch (e) {
    document.getElementById('loginError').textContent = '网络错误'
    document.getElementById('loginError').classList.remove('hidden')
  }
}

function doLogout() {
  TOKEN = ''
  localStorage.removeItem('bfaa_token')
  document.getElementById('mainApp').classList.add('hidden')
  document.getElementById('loginPage').classList.remove('hidden')
}

async function authFetch(url, opts = {}) {
  const headers = { ...opts.headers, 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
  const res = await fetch(API + url, { ...opts, headers })
  if (res.status === 401) { doLogout(); return null }
  return res
}

function showApp() {
  document.getElementById('loginPage').classList.add('hidden')
  document.getElementById('mainApp').classList.remove('hidden')
  switchPage(currentPage)
}

// ============ 页面切换 ============
function switchPage(page) {
  currentPage = page
  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page)
  })
  const loaders = {
    exhibitions: loadExhibitions,
    artworks: loadArtworks,
    programs: loadPrograms,
    news: loadNews,
    courses: loadCourses,
    submissions: loadSubmissions,
    feedback: loadFeedback,
    sensitiveWords: loadSensitiveWords,
    announcements: loadAnnouncements,
    digitalGalleries: loadDigitalGalleries,
    bookings: loadBookings
  }
  if (loaders[page]) loaders[page]()
}

// ============ 展览 ============
async function loadExhibitions() {
  const res = await authFetch('/api/admin/exhibitions')
  const list = await res.json()
  let html = `<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">展览管理</h2>
    <button class="btn btn-primary" onclick="showExhibitionForm()">+ 新增展览</button>
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
    <thead><tr class="border-b bg-gray-50 text-left text-gray-500">
      <th class="p-3">标题</th><th class="p-3">类型</th><th class="p-3">时间</th><th class="p-3">地点</th><th class="p-3">可预约</th><th class="p-3 w-24">操作</th>
    </tr></thead><tbody>`
  list.forEach(e => {
    html += `<tr class="border-b hover:bg-gray-50">
      <td class="p-3 font-medium">${esc(e.title)}</td>
      <td class="p-3"><span class="badge badge-confirmed">${esc(e.type)}</span></td>
      <td class="p-3 text-gray-500">${esc(e.time||'-')}</td>
      <td class="p-3 text-gray-500">${esc(e.location||'-')}</td>
      <td class="p-3">${e.reservable ? '<span class="badge badge-pending">可预约</span>' : '-'}</td>
      <td class="p-3">
        <button class="btn btn-outline btn-sm mr-1" onclick='editExhibition(${JSON.stringify(e).replace(/'/g,"&#39;")})'>编辑</button>
        <button class="btn btn-outline btn-sm text-red-600" onclick="delExhibition('${e.id}')">删除</button>
      </td></tr>`
  })
  html += '</tbody></table></div>'
  document.getElementById('pageContent').innerHTML = html
}

function showExhibitionForm(data) {
  const d = data || { id: genId('exh'), type: '当前展览', title: '', image: '', time: '', location: '', organizer: '', intro: '', artworks: [], status_text: '', reservable: false, ended: false, booking_dates: [], booking_times: [], booking_quota: 5 }
  const isEdit = !!data
  let html = `<div class="card p-6 max-w-2xl">
    <h3 class="text-lg font-bold mb-4">${isEdit ? '编辑展览' : '新增展览'}</h3>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm text-gray-600 mb-1">ID</label><input class="input" id="ef_id" value="${d.id}" disabled></div>
      <div><label class="block text-sm text-gray-600 mb-1">类型</label><select class="input" id="ef_type"><option ${d.type==='当前展览'?'selected':''}>当前展览</option><option ${d.type==='展览预告'?'selected':''}>展览预告</option><option ${d.type==='展览回顾'?'selected':''}>展览回顾</option></select></div>
      <div><label class="block text-sm text-gray-600 mb-1">标题</label><input class="input" id="ef_title" value="${esc(d.title)}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">展期</label>
          <div class="flex gap-2 items-center">
             <input class="input" id="ef_time_start" type="date" value="${esc((d.time||'').split('至')[0]?.trim()||'')}" style="flex:1">
             <span class="text-sm text-gray-400 px-1">至</span>
             <input class="input" id="ef_time_end" type="date" value="${esc((d.time||'').split('至')[1]?.trim()||'')}" style="flex:1">
           </div></div>
      <div><label class="block text-sm text-gray-600 mb-1">地点</label><input class="input" id="ef_location" value="${esc(d.location||'')}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">主办方</label><input class="input" id="ef_organizer" value="${esc(d.organizer||'')}"></div>
      <div class="col-span-2"><label class="block text-sm text-gray-600 mb-1">封面图</label><input class="input" id="ef_image" value="${esc(d.image||'')}"></div>
      <div class="col-span-2"><label class="block text-sm text-gray-600 mb-1">简介</label><textarea class="input" id="ef_intro">${esc(d.intro||'')}</textarea></div>
      <div><label class="block text-sm text-gray-600 mb-1">状态文字</label><input class="input" id="ef_status_text" value="${esc(d.status_text||'')}" placeholder="如：即将开展、报名已结束"></div>
      <div><label class="block text-sm text-gray-600 mb-1">状态</label>
        <div class="flex items-center gap-4" style="min-height:38px">
          <label class="flex items-center gap-2"><input type="checkbox" id="ef_reservable" ${d.reservable?'checked':''}><span class="text-sm">可预约</span></label>
          <label class="flex items-center gap-2"><input type="checkbox" id="ef_ended" ${d.ended?'checked':''}><span class="text-sm">已结束</span></label>
        </div></div>
      <div><label class="block text-sm text-gray-600 mb-1">每日预约上限</label><input class="input" id="ef_booking_quota" type="number" min="1" max="999" value="${d.booking_quota||5}" placeholder="默认5人"></div>
      <div><label class="block text-sm text-gray-600 mb-1">预约日期</label>
        <div id="ef_booking_dates_list">${(Array.isArray(d.booking_dates)?d.booking_dates:[]).map((item, idx) => `<div class="flex gap-2 mb-2 items-center"><input class="input" type="date" value="${esc(item.raw||'')}" data-idx="${idx}" style="flex:1"><button type="button" class="del-btn" onclick="removeBookingDate(${idx})">删除</button></div>`).join('')}</div>
        <button type="button" class="upload-btn" onclick="addBookingDate()">+ 添加日期</button>
      </div>
      <div><label class="block text-sm text-gray-600 mb-1">预约时段</label>
        <div id="ef_booking_times_list">${(Array.isArray(d.booking_times)?d.booking_times:[]).map((t, idx) => `<div class="flex gap-2 mb-2 items-center"><input class="input" type="time" value="${esc(t)}" data-idx="${idx}" style="flex:1"><button type="button" class="del-btn" onclick="removeBookingTime(${idx})">删除</button></div>`).join('')}</div>
        <button type="button" class="upload-btn" onclick="addBookingTime()">+ 添加时段</button>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="saveExhibition(${isEdit})">${isEdit ? '保存' : '创建'}</button>
      <button class="btn btn-outline" onclick="loadExhibitions()">取消</button>
    </div></div>`
  document.getElementById('pageContent').innerHTML = html
  bindImageUpload('ef_image')
}
function editExhibition(d) { showExhibitionForm(d) }
// 展览预约日期/时段管理
function addBookingDate() {
  const list = document.getElementById('ef_booking_dates_list')
  const idx = list.children.length
  const div = document.createElement('div')
  div.className = 'flex gap-2 mb-2 items-center'
  div.innerHTML = `<input class="input" type="date" data-idx="${idx}" style="flex:1"><button type="button" class="del-btn" onclick="this.parentElement.remove()">删除</button>`
  list.appendChild(div)
}
function removeBookingDate(idx) {
  const list = document.getElementById('ef_booking_dates_list')
  if (list.children[idx]) list.children[idx].remove()
}
function addBookingTime() {
  const list = document.getElementById('ef_booking_times_list')
  const idx = list.children.length
  const div = document.createElement('div')
  div.className = 'flex gap-2 mb-2 items-center'
  div.innerHTML = `<input class="input" type="time" data-idx="${idx}" style="flex:1"><button type="button" class="del-btn" onclick="this.parentElement.remove()">删除</button>`
  list.appendChild(div)
}
function removeBookingTime(idx) {
  const list = document.getElementById('ef_booking_times_list')
  if (list.children[idx]) list.children[idx].remove()
}
function collectBookingDates() {
  const WEEKS = ['周日','周一','周二','周三','周四','周五','周六']
  const MONTHS = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']
  const inputs = document.getElementById('ef_booking_dates_list').querySelectorAll('input[type="date"]')
  return Array.from(inputs).filter(el => el.value).map(el => {
    const d = new Date(el.value)
    return { day: String(d.getDate()).padStart(2,'0'), week: WEEKS[d.getDay()], month: MONTHS[d.getMonth()+1], raw: el.value }
  })
}
function collectBookingTimes() {
  const inputs = document.getElementById('ef_booking_times_list').querySelectorAll('input[type="time"]')
  return Array.from(inputs).filter(el => el.value).map(el => el.value)
}
async function saveExhibition(isEdit) {
  // 组装展期
  const timeStart = document.getElementById('ef_time_start').value
  const timeEnd = document.getElementById('ef_time_end').value
  let time = ''
  if (timeStart && timeEnd) {
    const ds = new Date(timeStart), de = new Date(timeEnd)
    const fmt = (d) => `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日`
    time = fmt(ds) + ' 至 ' + fmt(de)
  } else if (timeStart) {
    time = timeStart
  }
  const bookingDates = collectBookingDates()
  const bookingTimes = collectBookingTimes()
  const body = { id: document.getElementById('ef_id').value, type: document.getElementById('ef_type').value, title: document.getElementById('ef_title').value, time, location: document.getElementById('ef_location').value, organizer: document.getElementById('ef_organizer').value, image: document.getElementById('ef_image').value, intro: document.getElementById('ef_intro').value, status_text: document.getElementById('ef_status_text').value, reservable: document.getElementById('ef_reservable').checked, ended: document.getElementById('ef_ended').checked, booking_quota: parseInt(document.getElementById('ef_booking_quota').value) || 5, booking_dates: JSON.stringify(bookingDates), booking_times: JSON.stringify(bookingTimes) }
  if (!body.title) return alert('标题必填')
  const url = isEdit ? `/api/admin/exhibitions/${body.id}` : '/api/admin/exhibitions'
  await authFetch(url, { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(body) })
  loadExhibitions()
}
async function delExhibition(id) { if (!confirm('确定删除？')) return; await authFetch(`/api/admin/exhibitions/${id}`, { method: 'DELETE' }); loadExhibitions() }

// ============ 藏品 ============
async function loadArtworks() {
  const res = await authFetch('/api/admin/artworks')
  const list = await res.json()
  let html = `<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">藏品管理</h2>
    <button class="btn btn-primary" onclick="showArtworkForm()">+ 新增藏品</button>
  </div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`
  list.forEach(a => {
    html += `<div class="card overflow-hidden">
      <div class="h-40 bg-gray-100 flex items-center justify-center overflow-hidden">
        ${a.image ? `<img src="${esc(a.image)}" class="w-full h-full object-cover">` : '<span class="text-gray-300 text-4xl">🎨</span>'}
      </div>
      <div class="p-3">
        <h4 class="font-medium">${esc(a.title)}</h4>
        <p class="text-sm text-gray-500">${esc(a.artist||'')} · ${esc(a.category||'')}</p>
        <div class="mt-2 flex gap-1">
          <button class="btn btn-outline btn-sm" onclick='editArtwork(${JSON.stringify(a).replace(/'/g,"&#39;")})'>编辑</button>
          <button class="btn btn-outline btn-sm text-red-600" onclick="delArtwork('${a.id}')">删除</button>
        </div>
      </div></div>`
  })
  html += '</div>'
  document.getElementById('pageContent').innerHTML = html
}
function showArtworkForm(data) {
  const d = data || { id:genId('art'),title:'',artist:'',category:'中国画',size:'',image:'',birth:'',identity:'',artist_intro:'',work_intro:'' }
  const isEdit = !!data
  let html = `<div class="card p-6 max-w-2xl"><h3 class="text-lg font-bold mb-4">${isEdit?'编辑':'新增'}藏品</h3>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm text-gray-600 mb-1">ID</label><input class="input" id="af_id" value="${d.id}" disabled></div>
      <div><label class="block text-sm text-gray-600 mb-1">标题</label><input class="input" id="af_title" value="${esc(d.title)}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">作者</label><input class="input" id="af_artist" value="${esc(d.artist||'')}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">分类</label><select class="input" id="af_category"><option ${d.category==='齐白石'?'selected':''}>齐白石</option><option ${d.category==='中国画'?'selected':''}>中国画</option></select></div>

async function saveProgram(isEdit) {

  const timeDate = document.getElementById('pf_time_date').value

  if (timeDate) {

    time = `${d2.getFullYear()}年${d2.getMonth()+1}月${d2.getDate()}日`

function insertNewsImage() {
  const fileInput = document.createElement('input')
  fileInput.type = 'file'
  fileInput.accept = 'image/*'
  fileInput.onchange = async () => {
    const file = fileInput.files[0]
    if (!file) return
    try {
      const result = await uploadImage(file)
      const textarea = document.getElementById('nf_content')
      const pos = textarea.selectionStart
      const before = textarea.value.substring(0, pos)
      const after = textarea.value.substring(pos)
      const insert = '[img:' + result.url + ']'
      textarea.value = before + insert + after
      alert('图片已插入')
    } catch (e) {
      alert('上传失败：' + e.message)
    }
  }
  fileInput.click()
}

    html += `<tr class="border-b"><td class="p-3 text-center text-gray-400" colspan="4">暂无敏感词</td></tr>`

      <td class="p-3 text-gray-500">${esc(w.created_at||'-')}</td>

    </tr>`
  })
  html += '</tbody></table></div>'
  if (list.length > 0) {
    html += `<div class="mt-3"><button class="btn btn-outline btn-sm text-red-600" onclick="clearSensitiveWords()">清空全部</button></div>`
  }

async function addSensitiveWords() {
  const input = document.getElementById('sw_input')
  const words = (input.value || '').trim()
  if (!words) return alert('请填写敏感词')
  const res = await authFetch('/api/admin/sensitive-words', { method: 'POST', body: JSON.stringify({ words }) })
  const data = await res.json()
  if (data.existing && data.existing.length > 0) {
    alert(`已添加 ${data.added} 个，${data.existing.length} 个已存在：${data.existing.join('、')}`)
  } else {
    alert(`已添加 ${data.added} 个敏感词`)
  }
  loadSensitiveWords()
}

async function clearSensitiveWords() { if (!confirm('确定清空全部敏感词？')) return; await authFetch('/api/admin/sensitive-words', { method: 'DELETE' }); loadSensitiveWords() }

// ============ 预约 ============
async function loadBookings() {
  const [bres, stats] = await Promise.all([authFetch('/api/admin/bookings'), authFetch('/api/admin/bookings/stats')])
  const list = await bres.json()
  const s = await stats.json()
  // 按来源分组
  const sourceMap = {}
  ;(s.bySource || []).forEach(item => { sourceMap[item.program_id] = item.confirmed_count })
  // 按类型分组
  const kindMap = {}
  ;(s.byKind || []).forEach(item => { kindMap[item.program_kind] = { total: item.total_count, confirmed: item.confirmed_count } })

  let html = `<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">预约管理</h2>
  </div>
  <div class="grid grid-cols-4 gap-4 mb-6">
    <div class="card p-4 text-center"><div class="text-2xl font-bold">${s.total||0}</div><div class="text-sm text-gray-500">预约总人数</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-yellow-600">${s.pending||0}</div><div class="text-sm text-gray-500">待确认人数</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-green-600">${s.confirmed||0}</div><div class="text-sm text-gray-500">已确认人数</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-blue-600">${s.today||0}</div><div class="text-sm text-gray-500">今日新增人数</div></div>
  </div>`

  // 按类型分组卡片
  const kindLabels = { '展览预约':'🖼 展览预约', '讲座预约':'📋 讲座预约', '活动预约':'🎭 活动预约' }
  html += `<div class="grid grid-cols-3 gap-4 mb-6">`
  Object.keys(kindLabels).forEach(k => {
    const info = kindMap[k] || { total: 0, confirmed: 0 }
    html += `<div class="card p-4"><div class="text-sm text-gray-500 mb-1">${kindLabels[k]||k}</div><div class="flex items-baseline gap-2"><span class="text-xl font-bold text-green-600">${info.confirmed}</span><span class="text-sm text-gray-400">已确认 / ${info.total} 总计</span></div></div>`
  })
  html += `</div>`

  // 按来源分组统计
  if (s.bySource && s.bySource.length > 0) {
    html += `<div class="card p-4 mb-6"><div class="text-sm font-medium text-gray-600 mb-3">各展览/活动已确认人数</div><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">`
    s.bySource.forEach(item => {
      html += `<div class="border rounded-lg p-3"><div class="text-xs text-gray-500">${esc(item.program_kind||'')}</div><div class="text-sm font-medium truncate" title="${esc(item.program_title||'')}">${esc(item.program_title||'未指定')}</div><div class="text-lg font-bold text-green-600">${item.confirmed_count} <span class="text-xs text-gray-400 font-normal">人已确认</span></div></div>`
    })
    html += `</div></div>`
  }

  // 筛选栏
  html += `<div class="flex gap-3 mb-4 items-center">
    <select class="input" style="width:140px" id="bk_filter_kind" onchange="filterBookings()">
      <option value="">全部类型</option><option value="展览预约">展览预约</option><option value="讲座预约">讲座预约</option><option value="活动预约">活动预约</option>
    </select>
    <select class="input" style="width:140px" id="bk_filter_status" onchange="filterBookings()">
      <option value="">全部状态</option><option value="待确认">待确认</option><option value="已确认">已确认</option><option value="已完成">已完成</option><option value="已取消">已取消</option>
    </select>
    <input class="input" style="width:200px" id="bk_filter_keyword" placeholder="搜索姓名/手机/预约号" oninput="filterBookings()">
  </div>
  <div id="batchBar" class="hidden mb-4 flex items-center gap-3 bg-amber-50 border border-amber-200 rounded-lg p-3">
    <span class="text-sm text-amber-700">已选择 <strong id="selectedCount">0</strong> 条</span>
    <button onclick="batchUpdateStatus('已确认')" class="px-3 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">批量确认</button>
    <button onclick="batchUpdateStatus('已取消')" class="px-3 py-1 text-xs bg-gray-500 text-white rounded hover:bg-gray-600">批量取消</button>
    <button onclick="batchUpdateStatus('已完成')" class="px-3 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">批量完成</button>
    <button onclick="batchDelete()" class="px-3 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">批量删除</button>
    <button onclick="clearSelection()" class="px-3 py-1 text-xs text-gray-500 hover:text-gray-700">取消选择</button>
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
    <thead><tr class="border-b bg-gray-50 text-left text-gray-500">
      <th class="p-3 w-10"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this.checked)"></th>
      <th class="p-3">预约号</th><th class="p-3">类型</th><th class="p-3">来源</th><th class="p-3">联系人/参观人</th><th class="p-3">日期/时段</th><th class="p-3">状态</th><th class="p-3 w-32">操作</th>
    </tr></thead><tbody id="bk_tbody">`
  list.forEach(b => {
    html += renderBookingRow(b, sourceMap)
  })
  html += '</tbody></table></div>'
  document.getElementById('pageContent').innerHTML = html
  // 保存完整列表供筛选用
  window._bookingList = list
  window._bookingSourceMap = sourceMap
}
function renderBookingRow(b, sourceMap) {
  const badgeClass = b.status==='待确认'?'badge-pending':b.status==='已确认'?'badge-confirmed':b.status==='已完成'?'badge-done':'badge-cancelled'
  let visitorsHtml = ''
  const visitors = (b.visitors_info && Array.isArray(b.visitors_info) && b.visitors_info.length > 0)
    ? b.visitors_info
    : [{ name: b.contact_name, phone: b.contact_phone }]
  visitors.forEach((v, i) => {
    const label = visitors.length === 1 ? '' : `<span class="text-gray-400 mr-1">${i+1}.</span>`
    const tag = i === 0 ? '<span class="text-xs bg-amber-100 text-amber-700 rounded px-1 ml-1">联系人</span>' : ''
    visitorsHtml += `<div class="${i > 0 ? 'mt-1' : ''}">${label}<span class="font-medium">${esc(v.name||'')}</span> <span class="text-gray-500">${esc(v.phone||'')}</span>${tag}</div>`
  })
  return `<tr class="border-b hover:bg-gray-50" data-kind="${esc(b.program_kind||'')}" data-status="${esc(b.status||'')}" data-search="${esc((b.contact_name||'')+(b.contact_phone||'')+(b.booking_no||''))}">
    <td class="p-3"><input type="checkbox" class="booking-check" data-id="${b.id}" onchange="onCheckChange()"></td>
    <td class="p-3 font-mono text-xs">${esc(b.booking_no)}</td>
    <td class="p-3"><span class="badge badge-confirmed">${esc(b.program_kind||'')}</span></td>
    <td class="p-3 text-sm">${esc(b.program_title||'-')}</td>
    <td class="p-3">${visitorsHtml}</td>
    <td class="p-3 text-xs">${esc(b.booking_date||'-')} ${esc(b.booking_time||'')}</td>
    <td class="p-3"><span class="badge ${badgeClass}">${esc(b.status)}</span></td>
    <td class="p-3">
      <select class="text-xs border rounded p-1" onchange="updateBookingStatus(${b.id}, this.value)">
        <option ${b.status==='待确认'?'selected':''}>待确认</option>
        <option ${b.status==='已确认'?'selected':''}>已确认</option>
        <option ${b.status==='已完成'?'selected':''}>已完成</option>
        <option ${b.status==='已取消'?'selected':''}>已取消</option>
      </select>
    </td></tr>`
}
function filterBookings() {
  const kind = document.getElementById('bk_filter_kind').value
  const status = document.getElementById('bk_filter_status').value
  const keyword = (document.getElementById('bk_filter_keyword').value || '').toLowerCase()
  document.querySelectorAll('#bk_tbody tr').forEach(tr => {
    const trKind = (tr.getAttribute('data-kind')||'')
    const trStatus = (tr.getAttribute('data-status')||'')
    const trSearch = (tr.getAttribute('data-search')||'').toLowerCase()
    let show = true
    if (kind && trKind !== kind) show = false
    if (status && trStatus !== status) show = false
    if (keyword && !trSearch.includes(keyword)) show = false
    tr.style.display = show ? '' : 'none'
  })
}
async function updateBookingStatus(id, status) {
  await authFetch(`/api/admin/bookings/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) })
  loadBookings()
}

// ============ 批量操作 ============
function getSelectedIds() {
  return Array.from(document.querySelectorAll('.booking-check:checked')).map(el => Number(el.dataset.id))
}
function onCheckChange() {
  const ids = getSelectedIds()
  const bar = document.getElementById('batchBar')
  const count = document.getElementById('selectedCount')
  if (ids.length > 0) { bar.classList.remove('hidden'); bar.classList.add('flex'); count.textContent = ids.length }
  else { bar.classList.add('hidden'); bar.classList.remove('flex') }
  const allBox = document.getElementById('checkAll')
  if (allBox) allBox.checked = document.querySelectorAll('.booking-check:checked').length === document.querySelectorAll('.booking-check').length
}
function toggleCheckAll(checked) {
  document.querySelectorAll('.booking-check').forEach(el => { el.checked = checked })
  onCheckChange()
}
function clearSelection() {
  toggleCheckAll(false)
}
async function batchUpdateStatus(status) {
  const ids = getSelectedIds()
  if (ids.length === 0) return
  if (!confirm(`确认将 ${ids.length} 条预约状态改为"${status}"？`)) return
  await authFetch('/api/admin/bookings/batch-status', { method: 'PUT', body: JSON.stringify({ ids, status }) })
  loadBookings()
}
async function batchDelete() {
  const ids = getSelectedIds()
  if (ids.length === 0) return
  if (!confirm(`确认删除 ${ids.length} 条预约记录？此操作不可恢复。`)) return
  await authFetch('/api/admin/bookings/batch', { method: 'DELETE', body: JSON.stringify({ ids }) })
  loadBookings()
}

// ============ 数字展厅 ============
async function loadDigitalGalleries() {
  const res = await authFetch('/api/admin/digital-galleries')
  const list = await res.json()
  const online = list.filter(g => g.status).length
  let html = `<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold">数字展厅 · 在线全景展览</h2>
    <button class="btn btn-primary" onclick="showDigitalGalleryForm()">+ 新增展厅</button>
  </div>
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-green-600">${online}</div><div class="text-sm text-gray-500">已上架</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-gray-500">${list.length - online}</div><div class="text-sm text-gray-500">已下架</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-bold text-gray-700">${list.length}</div><div class="text-sm text-gray-500">总计</div></div>
  </div>`
  if (list.length === 0) {
    html += `<div class="card p-8 text-center text-gray-400">暂无数字展厅，点击右上角添加</div>`
  } else {
    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`
    list.forEach(g => {
      html += `<div class="card overflow-hidden">
        ${g.cover ? `<img src="${esc(g.cover)}" class="w-full h-40 object-cover" onerror="this.style.display='none'">` : `<div class="w-full h-40 bg-gray-100 flex items-center justify-center text-gray-300 text-4xl">🌐</div>`}
        <div class="p-4">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-bold text-gray-800">${esc(g.title)}</h3>
            <span class="badge ${g.status ? 'badge-confirmed' : 'badge-cancelled'}">${g.status ? '上架' : '下架'}</span>
          </div>
          ${g.description ? `<p class="text-sm text-gray-500 mb-2 line-clamp-2">${esc(g.description)}</p>` : ''}
          <div class="text-xs text-gray-400 truncate mb-3">🔗 ${esc(g.url)}</div>
          <div class="text-xs text-gray-400 mb-3">排序: ${g.sort_order || 0} · ${esc(g.created_at||'')}</div>
          <div class="flex gap-2">
            <button class="btn btn-outline btn-sm" onclick='editDigitalGallery(${JSON.stringify(g).replace(/'/g,"&#39;")})'>编辑</button>
            <button class="btn ${g.status ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="toggleDigitalGalleryStatus('${g.id}', ${g.status})">${g.status ? '下架' : '上架'}</button>
            <button class="btn btn-outline btn-sm text-red-600" onclick="delDigitalGallery('${g.id}')">删除</button>
          </div>
        </div>
      </div>`
    })
    html += `</div>`
  }
  document.getElementById('pageContent').innerHTML = html
}
function showDigitalGalleryForm(data) {
  const d = data || { id:genId('dg'), title:'', url:'', cover:'', description:'', status:true, sort_order:0 }
  const isEdit = !!data
  let html = `<div class="card p-6 max-w-2xl"><h3 class="text-lg font-bold mb-4">${isEdit?'编辑':'新增'}数字展厅</h3>
    <input type="hidden" id="dg_id" value="${d.id}">
    <div class="grid grid-cols-1 gap-4 mb-4">
      <div><label class="block text-sm text-gray-600 mb-1">展厅标题 *</label><input class="input" id="dg_title" value="${esc(d.title)}" placeholder="如：真言可贵——周思聪的变法之路"></div>
      <div><label class="block text-sm text-gray-600 mb-1">全景页面 URL *</label><input class="input" id="dg_url" value="${esc(d.url)}" placeholder="https://quanjing.artron.net/.../tour.html"></div>
      <div><label class="block text-sm text-gray-600 mb-1">封面图 URL</label><input class="input" id="dg_cover" value="${esc(d.cover||'')}" placeholder="留空则使用默认背景"></div>
      <div><label class="block text-sm text-gray-600 mb-1">简介</label><textarea class="input" id="dg_description" placeholder="展厅简介（选填）">${esc(d.description||'')}</textarea></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm text-gray-600 mb-1">状态</label><select class="input" id="dg_status">
          <option value="1" ${d.status?'selected':''}>上架</option><option value="0" ${!d.status?'selected':''}>下架</option></select></div>
        <div><label class="block text-sm text-gray-600 mb-1">排序（越小越靠前）</label><input class="input" id="dg_sort_order" type="number" value="${d.sort_order||0}"></div>
      </div>
    </div>
    <div class="flex gap-2"><button class="btn btn-primary" onclick="saveDigitalGallery(${isEdit})">${isEdit?'保存':'创建'}</button><button class="btn btn-outline" onclick="loadDigitalGalleries()">取消</button></div></div>`
  document.getElementById('pageContent').innerHTML = html
}
function editDigitalGallery(d) { showDigitalGalleryForm(d) }
async function saveDigitalGallery(isEdit) {
  const body = {
    id: document.getElementById('dg_title').dataset.id || genId('dg'),
    title: document.getElementById('dg_title').value,
    url: document.getElementById('dg_url').value,
    cover: document.getElementById('dg_cover').value,
    description: document.getElementById('dg_description').value,
    status: document.getElementById('dg_status').value === '1',
    sort_order: parseInt(document.getElementById('dg_sort_order').value) || 0
  }
  // 从 showDigitalGalleryForm 传过来的 id 在 form 里没有单独字段，需要用 data.id
  if (!body.title.trim()) return alert('请填写展厅标题')
  if (!body.url.trim()) return alert('请填写全景页面 URL')
  // 获取 id：从隐藏的 data 属性或重新生成
  // 实际上 edit 时 id 来自传入的 d.id，我们需要在 form 里加一个隐藏字段
  const idInput = document.getElementById('dg_id')
  const id = idInput ? idInput.value : body.id
  await authFetch(isEdit ? `/api/admin/digital-galleries/${id}` : '/api/admin/digital-galleries', { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify({ ...body, id }) })
  loadDigitalGalleries()
}
async function toggleDigitalGalleryStatus(id, currentStatus) {
  const res = await authFetch('/api/admin/digital-galleries')
  const list = await res.json()
  const item = list.find(g => g.id === id)
  if (!item) return
  await authFetch(`/api/admin/digital-galleries/${id}`, { method: 'PUT', body: JSON.stringify({ ...item, status: !currentStatus }) })
  loadDigitalGalleries()
}
async function delDigitalGallery(id) { if (!confirm('确定删除？')) return; await authFetch(`/api/admin/digital-galleries/${id}`, { method: 'DELETE' }); loadDigitalGalleries() }

// ============ 工具 ============
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// 启动
if (TOKEN) { showApp() }
</script>
